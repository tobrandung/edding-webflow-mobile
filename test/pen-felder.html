<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D-Slider – Feld-Modus</title>
<!--
  Der schlankste Aufbau: EINE gestylte Karte, kein Datenblock, keine kopierten Elemente.
  Die vier Textfassungen haengen als data-pen-1 … data-pen-4 direkt an dem Element, das sie
  betreffen. Stift 1 braucht kein Attribut - dort bleibt der im Designer eingetippte Text stehen.
-->
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; font: 15px/1.5 -apple-system, sans-serif; padding: 20px; background: #f3f4f6; }

  .card { background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.12);
          padding: 20px; margin-bottom: 16px; display: flex; gap: 16px; }
  .card__left { flex: 1; }
  .headline { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
  .body { font-size: 14px; margin: 0 0 12px; }
  .temp { font-size: 22px; font-weight: 700; }
  .label { font-size: 13px; color: #555; }
  .btn-red { background: #fa0000; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; }

  /* Weicher Wechsel: das Modul setzt is-swapping fuer 250 ms am Slider-Div. */
  [data-pen-field] { transition: opacity .25s ease, transform .25s ease; }
  .is-swapping [data-pen-field] { opacity: 0; transform: translateX(-12px); }

  .canvas { width: 100%; aspect-ratio: 990/770; position: relative; outline: 1px dashed #cfd8e3;
            background: #fff; border-radius: 12px; }
  .btns { display: flex; gap: 10px; margin-top: 12px; }
  .btns button { width: 44px; height: 44px; border-radius: 12px; background: #fff;
                 border: 1.5px solid #00368e; color: #00368e; font-size: 18px; }
  .btns button.is-disabled { opacity: .35; }
</style>
</head>
<body data-edding-no-autostart>

<div data-edding-pen-slider="hitze" data-pen-fov="0.7" data-pen-shift-y="-0.15" data-pen-debug>

  <div class="card">
    <div class="card__left">
      <p class="headline"
         data-pen-field="headline"
         data-pen-2="edding 8300 Industry Permanentmarker"
         data-pen-3="edding 50 Paint Marker"
         data-pen-4="edding 750 Paint Marker">edding 2000 C Permanentmarker</p>

      <p class="body"
         data-pen-field="body"
         data-pen-2="Hitzebeständige Tinte für raue und glatte Oberflächen."
         data-pen-3="Hitzebeständige Farbe für den industriellen Einsatz."
         data-pen-4="Hitzebeständige, glänzend deckende Beschichtung.">Die aufgetragene Farbe widersteht Hitze bis 300° Celsius. Sie ist auch UV-beständig.</p>

      <button class="btn-red">Zum Produkt</button>
    </div>
    <div>
      <div class="temp"><span
         data-pen-field="temp" data-pen-count-up
         data-pen-2="400" data-pen-3="250" data-pen-4="200">300</span>° C</div>
      <div class="label" data-pen-field="label">Hitzebeständig</div>
    </div>
  </div>

  <div class="canvas" data-pen-canvas></div>
  <div class="btns">
    <button data-pen-prev aria-label="Vorheriger Stift">‹</button>
    <button data-pen-next aria-label="Nächster Stift">›</button>
  </div>

</div>

<script type="module">
  import { initEdding } from '../src/edding-webflow.js';
  window.__api = initEdding({ assetBase: '../assets/' });
</script>

</body>
</html>
