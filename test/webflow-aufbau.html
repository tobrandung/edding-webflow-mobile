<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bild-Karussell – Webflow-Aufbau nachgebaut</title>
<!--
  Baut den Navigator-Baum des Nutzers 1:1 nach:

    section-slider_dirty   data-edding-image-brush
      container            data-brush-sticky
        padding-bottom
          padding-global
            section-slider_headline_wrapper   data-edding-stroke="dirty" (funktioniert schon)
          data-brush_comp                     <- hier fehlte data-brush-canvas
            data-brush-image
            data-brush-word
          padding-global

  Zwei Fassungen auf einer Seite: oben GENAU wie beim Nutzer (kaputt), unten korrigiert.
  So steht die Ursache in der Konsole und die Wirkung des Fixes daneben.
-->
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; font: 15px/1.5 -apple-system, sans-serif; }

  .container { max-width: 100%; }
  .padding-global { padding-left: 20px; padding-right: 20px; }
  .padding-bottom { padding-bottom: 40px; }
  .headline { font-size: 34px; font-weight: 700; margin: 0; }
  .spacer-xhuge { height: 60svh; }
  .marke { position: fixed; left: 8px; top: 8px; z-index: 99; background: #000; color: #fff;
           font: 12px/1.3 monospace; padding: 4px 8px; }

  /* Der Kasten fuer die Canvas: Seitenverhaeltnis der Fotos. */
  .brush-canvas { width: 100%; aspect-ratio: 1280/677; position: relative; }
  .brush-wort { font-size: 40px; font-weight: 700; color: #999; text-align: center; }
</style>
</head>
<body>

<div class="spacer-xhuge"></div>

<!-- ====================== 1. GENAU wie beim Nutzer: data-brush-canvas fehlt ================ -->
<section data-edding-image-brush data-brush-debug id="kaputt">
  <div class="container" data-brush-sticky>
    <div class="padding-bottom">
      <div class="padding-global">
        <div class="headline">Hält auf schmutzigen Oberflächen</div>
      </div>
      <div class="brush-canvas">                       <!-- kein data-brush-canvas -->
        <div data-brush-image data-src="../staubig.jpg"></div>
        <p class="brush-wort" data-brush-word>Staubig</p>
      </div>
      <div class="padding-global"></div>
    </div>
  </div>
</section>

<div class="spacer-xhuge"></div>

<!-- ====================== 2. Korrigiert ==================================================== -->
<section data-edding-image-brush data-brush-debug data-brush-sticky-top="200" id="ok">
  <div class="container" data-brush-sticky>
    <div class="padding-bottom">
      <div class="padding-global">
        <div class="headline">Hält auf schmutzigen Oberflächen</div>
      </div>
      <!-- data-brush-canvas ergaenzt; die vier Fotos kommen automatisch vom CDN, weil hier
           KEIN data-brush-image steht. Vier Woerter statt einem. -->
      <div class="brush-canvas" data-brush-canvas></div>
      <div class="padding-global">
        <p class="brush-wort" data-brush-word>Staubig</p>
        <p class="brush-wort" data-brush-word>Ölig</p>
        <p class="brush-wort" data-brush-word>Rostig</p>
        <p class="brush-wort" data-brush-word>Nass</p>
      </div>
    </div>
  </div>
</section>

<div class="spacer-xhuge"></div>

<script type="module">
  import { initEdding } from '../src/edding-webflow.js';
  window.__api = initEdding({ assetBase: '../assets/' });
</script>

</body>
</html>
