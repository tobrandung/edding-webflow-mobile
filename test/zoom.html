<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoomstufen – Strich hitze und wasser</title>
<!--
  Vergleichsseite fuer data-stroke-scale (Zoom) und data-stroke-offset-x/-y (Versatz).
  Volle Boxbreite, kein Innenrand - so wie im Mobile-Design, wo der Strich bis an die Kanten
  laeuft. Was ueber die Box hinausragt, beschneidet die Canvas; das ist beim Zoomen gewollt.

  Die Versatzwerte sind NICHT geraten: sie kommen aus einer Messung, die je Zoomstufe den
  Ausschnitt mit der meisten Farbe sucht. Ohne Versatz zoomt man bei der Wasser-Welle in die
  leere Mitte der Zeichnung hinein.

  Alle Striche stehen hier auf data-stroke-once mit Dauer 0 (malen sich beim Laden sofort fertig).
  Im Betrieb sind sie scroll-gescrubbt.
-->
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; font: 12px/1.35 -apple-system, sans-serif; background: #fff; }
  h1 { font-size: 15px; margin: 0; padding: 14px 16px 2px; }
  .hint { padding: 0 16px 8px; color: #666; }
  .row { border-top: 1px solid #eee; padding-bottom: 12px; }
  .lbl { padding: 7px 16px 5px; color: #666; }
  .lbl b { color: #161616; }
  .box { width: 100%; position: relative; outline: 1px dashed #dfe6ee; }
</style>
</head>
<body data-edding-no-autostart>

<h1>Zoom und Versatz – gemessene Stufen</h1>
<p class="hint">Von oben nach unten immer weiter reingezoomt. Die Werte in Klammern sind die
Attribute, die du im Designer setzt.</p>
<div id="rows"></div>

<script type="module">
  import { initEdding } from '../src/edding-webflow.js';

  // Zoom + gemessener Versatz (Ausschnitt mit der meisten Farbe)
  const VARIANTEN = {
    hitze: [
      { s: 1,   ox: 0,     oy: 0,    r: '390/280' },
      { s: 1.6, ox: -0.25, oy: 0.3,  r: '390/280' },
      { s: 2.2, ox: -0.54, oy: 0.48, r: '390/280' },
      { s: 3,   ox: -0.88, oy: 0.53, r: '390/280' },
      { s: 3.5, ox: -1.13, oy: 0.55, r: '390/280' },
    ],
    wasser: [
      { s: 1,   ox: 0,     oy: 0,     r: '390/230' },
      { s: 1.6, ox: -0.24, oy: -0.3,  r: '390/230' },
      { s: 2.2, ox: -0.52, oy: -0.56, r: '390/230' },
      { s: 3,   ox: 0.35,  oy: -0.75, r: '390/230' },
      { s: 3.5, ox: 0.39,  oy: -0.96, r: '390/230' },
    ],
  };

  const rows = document.getElementById('rows');
  for (const [preset, list] of Object.entries(VARIANTEN)) {
    for (const v of list) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<div class="lbl"><b>${preset}</b> — Zoom <b>${v.s}</b>
        (scale="${v.s}" offset-x="${v.ox}" offset-y="${v.oy}") <span data-out></span></div>
        <div class="box" style="aspect-ratio:${v.r}"
             data-edding-stroke="${preset}"
             data-stroke-scale="${v.s}"
             data-stroke-offset-x="${v.ox}" data-stroke-offset-y="${v.oy}"
             data-margin-x="0" data-margin-y="0"
             data-stroke-once data-stroke-duration="0"></div>`;
      rows.appendChild(row);
    }
  }

  const api = initEdding({ assetBase: '../assets/' });

  // Alles sofort bauen und fertig malen, damit man vergleichen kann, ohne zu scrollen.
  window.__alleZeigen = () => {
    api.strokes.forEach((st) => {
      st.ensureChapter();
      st.chapter.ready.then(() => {
        st.setProgress(1);
        const out = st.el.parentElement.querySelector('[data-out]');
        if (out) out.textContent = '→ Strichbreite ' + (Math.round(st.penWidth * 100) / 100);
      });
    });
  };
  setTimeout(window.__alleZeigen, 300);
</script>

</body>
</html>
